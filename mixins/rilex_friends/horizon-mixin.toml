[mod]
id = "rilex_friends"
version = "1.1.4"
priority = 100

[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "rilex_friends"
source = "src/runtime.rs"

[[module]]
id = "gui"
file = "crates/horizon-client/src/game.rs"
name = "rilex_friends_gui"
source = "src/gui.rs"

[[injection]]
id = "init-friends-hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "src/lib.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "friends-key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "src/key.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "key", ty = "&str", value = "key" },
    { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "src/register.rs"
bindings = [{ name = "mods", ty = "&mut Vec<NativeMod>", value = "&mut *mods" }]
